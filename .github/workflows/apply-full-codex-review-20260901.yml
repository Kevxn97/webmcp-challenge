name: Apply complete Codex review fixes

on:
  push:
    branches:
      - feat/challenge-9plus
    paths:
      - scripts/.apply-full-codex-review-20260901.trigger

permissions:
  contents: write

concurrency:
  group: apply-complete-codex-review
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/challenge-9plus
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply complete review patch
        shell: bash
        run: |
          set -euo pipefail

          patch_present() {
            grep -q 'scenarioWorkspaceAllocation' src/app/store.ts \
              && test -f src/app/selectionPolicy.ts \
              && test -f src/app/codexReview.test.ts \
              && grep -q 'run_ids\[0\] is the anchor' src/webmcp/tools.ts \
              && grep -q 'PACKAGING_LOCK_EFFECTIVE_TICK \* TICK_MINUTES' src/shared/controlDefinitions.ts
          }

          if ! patch_present; then
            python3 -m py_compile scripts/.apply-codex-review-fixes-full.py
            python3 scripts/.apply-codex-review-fixes-full.py
          fi

          patch_present

          rm -f \
            scripts/.apply-codex-review-fixes-full.py \
            scripts/.apply-staged-review-20260901.trigger \
            scripts/.apply-staged-review-20260901-v2.trigger \
            scripts/.apply-staged-review-20260901-v3.trigger \
            scripts/.apply-full-codex-review-20260901.trigger \
            .github/workflows/apply-staged-review-20260901.yml \
            .github/workflows/apply-staged-review-20260901-v2.yml \
            .github/workflows/apply-staged-review-20260901-v3.yml \
            .github/workflows/apply-full-codex-review-20260901.yml

          while IFS= read -r staged; do
            case "$staged" in
              scripts/.*codex*|scripts/.*review*|.github/workflows/*codex*|.github/workflows/*review*)
                rm -f "$staged"
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-only -r 57cf873bdb3e0fa63f85257c4d9c7f2ecb40defe 2>/dev/null || true)

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete submission gate
        run: npm run verify

      - name: Validate patch shape
        run: git diff --check

      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address Codex review findings"
          git push origin HEAD:feat/challenge-9plus
