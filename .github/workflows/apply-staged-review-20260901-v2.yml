name: Apply staged Codex review fixes v2

on:
  push:
    branches:
      - feat/challenge-9plus
    paths:
      - scripts/.apply-staged-review-20260901-v2.trigger

permissions:
  contents: write

concurrency:
  group: apply-staged-codex-review-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/challenge-9plus
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Locate and apply staged payload
        shell: bash
        run: |
          set -euo pipefail

          patch_present() {
            grep -q 'scenarioWorkspaceAllocation' src/app/store.ts \
              && test -f src/app/selectionPolicy.ts \
              && test -f src/app/codexReview.test.ts \
              && grep -q 'run_ids\[0\] is the anchor' src/webmcp/tools.ts \
              && grep -q 'PACKAGING_LOCK_EFFECTIVE_TICK \* TICK_MINUTES' src/shared/controlDefinitions.ts
          }

          run_payload() {
            local payload="$1"
            python3 -m py_compile "$payload"
            python3 "$payload"
          }

          if ! patch_present; then
            applied=0

            while IFS= read -r script; do
              case "$script" in
                *codex*|*review*|*apply*)
                  run_payload "$script"
                  applied=1
                  ;;
              esac
            done < <(find scripts -maxdepth 1 -type f -name '*.py' -print | sort)

            mapfile -t parts < <(find scripts -maxdepth 1 -type f \( -iname '*codex*part*' -o -iname '*review*part*' -o -iname '*apply*part*' \) -print | sort)
            if [ "${#parts[@]}" -gt 0 ]; then
              cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/codex-review-payload
              if head -1 /tmp/codex-review-payload | grep -q 'diff --git'; then
                git apply --check /tmp/codex-review-payload
                git apply /tmp/codex-review-payload
              else
                run_payload /tmp/codex-review-payload
              fi
              applied=1
            fi

            mapfile -t staged < <(git diff-tree --no-commit-id --name-only -r 57cf873bdb3e0fa63f85257c4d9c7f2ecb40defe 2>/dev/null || true)
            for path in "${staged[@]}"; do
              test -f "$path" || continue
              case "$path" in
                *.patch|*.diff)
                  git apply --check "$path"
                  git apply "$path"
                  applied=1
                  ;;
                *.yml|*.yaml)
                  python3 - "$path" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              line = lines[index]
              stripped = line.lstrip()
              if stripped.startswith("run: |"):
                  indent = len(line) - len(stripped)
                  index += 1
                  block = []
                  while index < len(lines):
                      candidate = lines[index]
                      candidate_indent = len(candidate) - len(candidate.lstrip())
                      if candidate.strip() and candidate_indent <= indent:
                          break
                      block.append(candidate[indent + 2:] if len(candidate) >= indent + 2 else "")
                      index += 1
                  text = "\n".join(block)
                  if any(marker in text for marker in (
                      "git apply", "base64 --decode", "python3 /tmp",
                      "apply_codex", "codex-review", "review-fix",
                  )) and "git push" not in text:
                      blocks.append(text)
                  continue
              index += 1
          Path("/tmp/staged-workflow-runs.sh").write_text("\n\n".join(blocks), encoding="utf-8")
          PY
                  if [ -s /tmp/staged-workflow-runs.sh ]; then
                    bash -euo pipefail /tmp/staged-workflow-runs.sh
                    applied=1
                  fi
                  ;;
              esac
            done

            test "$applied" -eq 1
          fi

          patch_present

          rm -f \
            scripts/.apply-staged-review-20260901.trigger \
            scripts/.apply-staged-review-20260901-v2.trigger \
            .github/workflows/apply-staged-review-20260901.yml \
            .github/workflows/apply-staged-review-20260901-v2.yml

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete submission gate
        run: npm run verify

      - name: Validate patch shape
        run: git diff --check

      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address Codex review findings"
          git push origin HEAD:feat/challenge-9plus
