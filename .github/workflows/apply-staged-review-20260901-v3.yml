name: Apply staged Codex review fixes v3

on:
  push:
    branches:
      - feat/challenge-9plus
    paths:
      - scripts/.apply-staged-review-20260901-v3.trigger

permissions:
  contents: write

concurrency:
  group: apply-staged-codex-review-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/challenge-9plus
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Recover and apply the prepared patch
        shell: bash
        run: |
          set -euo pipefail

          patch_present() {
            grep -q 'scenarioWorkspaceAllocation' src/app/store.ts \
              && test -f src/app/selectionPolicy.ts \
              && test -f src/app/codexReview.test.ts \
              && grep -q 'run_ids\[0\] is the anchor' src/webmcp/tools.ts \
              && grep -q 'PACKAGING_LOCK_EFFECTIVE_TICK \* TICK_MINUTES' src/shared/controlDefinitions.ts
          }

          if ! patch_present; then
            python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import json
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "9b02053b92bf6dac296df6ede3ecd1cfeea5f8e3..HEAD"],
              text=True,
          ).splitlines()
          preferred = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "57cf873bdb3e0fa63f85257c4d9c7f2ecb40defe"],
              text=True,
          ).splitlines()
          paths = []
          for raw in [*preferred, *changed]:
              path = root / raw
              if path.is_file() and path not in paths:
                  paths.append(path)

          payloads: list[tuple[str, bytes]] = []
          for path in paths:
              raw = path.read_bytes()
              payloads.append((str(path), raw))
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              diff_index = text.find("diff --git ")
              if diff_index >= 0:
                  payloads.append((f"{path}:embedded-diff", text[diff_index:].encode()))

              for match in re.finditer(r"H4sI[A-Za-z0-9+/=\r\n]{180,}", text):
                  compact = re.sub(r"\s+", "", match.group(0))
                  try:
                      payloads.append((f"{path}:gzip-base64", gzip.decompress(base64.b64decode(compact))))
                  except Exception:
                      pass

              if text.lstrip().startswith("{"):
                  try:
                      value = json.loads(text)
                  except Exception:
                      value = None
                  stack = [value]
                  while stack:
                      item = stack.pop()
                      if isinstance(item, dict):
                          stack.extend(item.values())
                      elif isinstance(item, list):
                          stack.extend(item)
                      elif isinstance(item, str) and len(item) > 180:
                          compact = re.sub(r"\s+", "", item)
                          if compact.startswith("H4sI"):
                              try:
                                  payloads.append((f"{path}:json-gzip-base64", gzip.decompress(base64.b64decode(compact))))
                              except Exception:
                                  pass

          applied = False
          for label, payload in payloads:
              stripped = payload.lstrip()
              if stripped.startswith(b"diff --git "):
                  target = Path("/tmp/codex-review.patch")
                  target.write_bytes(payload)
                  check = subprocess.run(["git", "apply", "--check", str(target)])
                  if check.returncode == 0:
                      subprocess.run(["git", "apply", str(target)], check=True)
                      applied = True
                      break
              if (
                  stripped.startswith(b"from __future__")
                  or stripped.startswith(b"from pathlib import Path")
                  or stripped.startswith(b"import re")
                  or stripped.startswith(b"#!/usr/bin/env python")
              ):
                  target = Path("/tmp/codex-review.py")
                  target.write_bytes(payload)
                  check = subprocess.run(["python3", "-m", "py_compile", str(target)])
                  if check.returncode == 0:
                      subprocess.run(["python3", str(target)], check=True)
                      applied = True
                      break

          if not applied:
              raise SystemExit("No complete prepared Codex-review payload could be recovered")
          PY
          fi

          patch_present

          rm -f \
            scripts/.apply-staged-review-20260901.trigger \
            scripts/.apply-staged-review-20260901-v2.trigger \
            scripts/.apply-staged-review-20260901-v3.trigger \
            .github/workflows/apply-staged-review-20260901.yml \
            .github/workflows/apply-staged-review-20260901-v2.yml \
            .github/workflows/apply-staged-review-20260901-v3.yml

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete submission gate
        run: npm run verify

      - name: Validate patch shape
        run: git diff --check

      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address Codex review findings"
          git push origin HEAD:feat/challenge-9plus
