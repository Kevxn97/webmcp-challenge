name: Apply staged Codex review fixes

on:
  push:
    branches:
      - feat/challenge-9plus
    paths:
      - scripts/.apply-staged-review-20260901.trigger

permissions:
  contents: write

concurrency:
  group: apply-staged-codex-review
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/challenge-9plus
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply previously staged review payload
        shell: bash
        run: |
          set -euo pipefail

          patch_present() {
            grep -q 'scenarioWorkspaceAllocation' src/app/store.ts \
              && test -f src/app/selectionPolicy.ts \
              && test -f src/app/codexReview.test.ts \
              && grep -q 'run_ids\[0\] is the anchor' src/webmcp/tools.ts \
              && grep -q 'PACKAGING_LOCK_EFFECTIVE_TICK \* TICK_MINUTES' src/shared/controlDefinitions.ts
          }

          if ! patch_present; then
            mapfile -t staged < <(git diff-tree --no-commit-id --name-only -r 57cf873bdb3e0fa63f85257c4d9c7f2ecb40defe 2>/dev/null || true)
            applied=0
            for path in "${staged[@]}"; do
              test -f "$path" || continue
              case "$path" in
                *.py)
                  python3 -m py_compile "$path"
                  python3 "$path"
                  applied=1
                  ;;
                *.patch|*.diff)
                  git apply --check "$path"
                  git apply "$path"
                  applied=1
                  ;;
                *)
                  first=$(head -c 4 "$path" || true)
                  if [ "$first" = "H4sI" ]; then
                    base64 --decode "$path" | gzip --decompress > /tmp/codex-review-payload
                    if head -1 /tmp/codex-review-payload | grep -qE 'python|from __future__|import '; then
                      python3 -m py_compile /tmp/codex-review-payload
                      python3 /tmp/codex-review-payload
                      applied=1
                    elif head -1 /tmp/codex-review-payload | grep -q 'diff --git'; then
                      git apply --check /tmp/codex-review-payload
                      git apply /tmp/codex-review-payload
                      applied=1
                    fi
                  fi
                  ;;
              esac
            done
            test "$applied" -eq 1
          fi

          patch_present

          rm -f \
            scripts/.apply-staged-review-20260901.trigger \
            .github/workflows/apply-staged-review-20260901.yml

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete submission gate
        run: npm run verify

      - name: Validate patch shape
        run: git diff --check

      - name: Commit verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address Codex review findings"
          git push origin HEAD:feat/challenge-9plus
